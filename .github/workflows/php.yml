name: PHP CI/CD Pipeline

# Kịch bản này sẽ tự động chạy mỗi khi có code mới được Push lên nhánh main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Tải mã nguồn về môi trường ảo của GitHub
    - name: Checkout code
      uses: actions/checkout@v3

    # Bước 2: Cài đặt PHP trên máy chủ ảo
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Bạn có thể đổi theo version PHP bạn đang dùng

    # Bước 3: Cài đặt các thư viện (Faker, v.v.) bằng Composer
    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    # Bước 4: Kiểm tra lỗi cú pháp (Lint) cho các file PHP quan trọng
    - name: Check PHP Syntax
      run: |
        php -l index.php
        php -l create.php
        php -l db.php